name: Build and release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish VERSION after the Linux AMD64 build and tests pass'
        type: boolean
        default: false
      reuse_run_id:
        description: 'Reuse a verified AMD64 artifact from an identical source tree'
        type: string
        required: false
  push:
    tags: ['v*-krun.*']
permissions:
  actions: read
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Fetch pinned upstream release tag
        run: |
          upstream_tag="v$(cut -d- -f1 VERSION)"
          git -C upstream/workerd fetch --depth=1 origin tag "$upstream_tag"
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Make room on GitHub-hosted runners
        if: runner.environment == 'github-hosted' && inputs.reuse_run_id == ''
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc
          docker image prune -af
          df -h .
      - name: Build, test and package
        if: inputs.reuse_run_id == ''
        env:
          WORKERD_BUILD_JOBS: ${{ vars.WORKERD_BUILD_JOBS || '3' }}
          WORKERD_BUILD_MEMORY_MB: ${{ vars.WORKERD_BUILD_MEMORY_MB || '10000' }}
          DISTRO_CACHE: ${{ vars.WORKERD_BUILD_CACHE }}
        run: |
          if [ -n "$DISTRO_CACHE" ]; then export WORKERD_BUILD_CACHE="$DISTRO_CACHE"; fi
          python3 scripts/distro.py release
      - name: Download previously verified AMD64 artifact
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: workerd-linux-x86_64
          path: dist
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Verify reused source and artifacts
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GH_REPO/actions/runs/$REUSE_RUN")
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .name <<< "$run")" = 'Build and release'
          source_sha=$(jq -r .head_sha <<< "$run")
          git fetch --no-tags origin "$source_sha"
          git diff --exit-code "$source_sha" HEAD -- . ':!.github/workflows/release.yml'
          cd dist
          sha256sum -c *.sha256
          jq -e --arg version "$(cat ../VERSION)" --arg sha "$source_sha" '.version == $version and .distro_commit == $sha and .distro_dirty == false' *.build-info.json
          python3 - <<'PYCODE'
          import glob, hashlib, json, gzip
          build = json.load(open(glob.glob('*.build-info.json')[0]))
          tests = json.load(open(glob.glob('*.test-info.json')[0]))
          with gzip.open('workerd-linux-64.gz', 'rb') as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          assert digest == build['binary_sha256'] == tests['binary_sha256']
          for key in ('checks', 'memory_checks', 'loader_memory_checks', 'cpu_metrics_checks', 'memory_metrics_checks'):
              assert tests[key] and all(tests[key].values()), key
          PYCODE
      - uses: actions/upload-artifact@v7
        with:
          name: workerd-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics-${{ matrix.arch }}
          path: .build/test-run/*.log
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: workerd-linux-*
          merge-multiple: true
          path: dist
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c *.sha256
          test -s workerd-linux-64.gz
          if tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A user may have published the Release before the binary was built.
            # Keep its title, notes and prerelease status; retries replace our assets.
            gh release upload "$RELEASE_TAG" workerd-linux-64.gz --clobber
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG" workerd-linux-64.gz
          fi
