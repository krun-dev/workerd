name: CPU patch build probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch pinned release tag
        run: git -C upstream/workerd fetch --depth=1 origin tag v1.20261116.1
      - name: Build CPU-only probe
        env:
          WORKERD_BUILD_JOBS: '3'
          WORKERD_BUILD_MEMORY_MB: '10000'
        run: python3 scripts/distro.py build
      - name: Verify CPU budget against real binary
        run: |
          cp -R tests/fixtures .build/test-run
          cp tests/integration.py .build/test-run/integration.py
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost python3 .build/test-run/integration.py .build/workerd-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-probe-diagnostics
          path: .build/test-run/*
          if-no-files-found: ignore
