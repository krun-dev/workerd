name: Check patches
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch pinned upstream release tag
        run: |
          upstream_tag="v$(cut -d- -f1 VERSION)"
          git -C upstream/workerd fetch --depth=1 origin tag "$upstream_tag"
      - run: python3 -m py_compile scripts/distro.py scripts/versioning.py tests/integration.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/distro.py prepare
      - run: git diff --exit-code && test -z "$(git -C upstream/workerd status --porcelain)"
